      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="dash-user">
      <div class="avatar" id="sidebar-admin-avatar">--</div>
      <div>
        <b id="sidebar-admin-name">جاري التحميل...</b>
        <span id="sidebar-admin-role">---</span>
      </div>
    </div>
    <nav class="dash-nav">
      <a href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span data-i18n="sidebar.dashboard">لوحتي</span>
      </a>
      <a href="therapists.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
        <span data-i18n="sidebar.therapistApprovals">اعتماد المعالجين</span>
      </a>
      <a href="users.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        <span data-i18n="sidebar.users">إدارة المستخدمين</span>
      </a>
      <a href="specialties.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a5 5 0 00-5 5v1.1A4 4 0 003 12a4 4 0 002 3.46V17a3 3 0 003 3h1"/><path d="M12 2a5 5 0 015 5v1.1A4 4 0 0121 12a4 4 0 01-2 3.46V17a3 3 0 01-3 3h-1"/></svg>
        <span data-i18n="sidebar.specialties">التخصصات</span>
      </a>
      <a href="complaints.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
        <span data-i18n="sidebar.complaints">الشكاوى والتقارير</span>
      </a>
      <a href="../../index.html" style="margin-top:16px; border-top:1px solid var(--border); padding-top:16px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span data-i18n="sidebar.logout">تسجيل الخروج</span>
      </a>
    </nav>
  </aside>

  <main class="dash-main">
    <button class="dash-toggle" type="button" aria-expanded="false" aria-controls="dashSidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      <span data-i18n="sidebar.menu">القائمة</span>
    </button>
    <div class="dash-head">
      <div><h1>إدارة المستخدمين</h1><p>كل حسابات المرضى المسجّلين في المنصة.</p></div>
    </div>

    <div class="filter-bar">
      <div class="search-input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input type="text" id="searchInput" placeholder="ابحث بالاسم أو البريد الإلكتروني...">
      </div>
      <select id="statusFilter">
        <option value="">كل الحالات</option>
        <option value="pending">قيد المراجعة</option>
        <option value="accepted">مقبول</option>
        <option value="rejected">مرفوض</option>
        <option value="deleted">محذوف</option>
      </select>
    </div>

    <div class="panel">
      <table class="data-table">
        <thead>
          <tr>
            <th>المريض</th>
            <th>الجامعة</th>
            <th>عدد الجلسات</th>
            <th>الوضع المجهول</th>
            <th>الحالة</th>
            <th>الإجراء</th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
      <p id="emptyMsg" style="display:none; text-align:center; color:var(--ink-500); padding:24px 0;">لا يوجد مستخدمون مطابقون.</p>
    </div>
  </main>
</div>

<div class="toast" id="usersToast"></div>

<script src="../../assets/js/main.js"></script>
<script src="../../assets/js/admin-common.js"></script>
<script>
  (function () {
    const tbody = document.getElementById('usersBody');
    const searchInput = document.getElementById('searchInput');
    const statusFilter = document.getElementById('statusFilter');

    function initials(name) {
      const parts = name.replace('مريض مجهول ', 'م ').split(' ');
      return (parts[0] ? parts[0][0] : 'م') + (parts[1] ? '.' + parts[1][0] : '');
    }

    function render() {
      let users = Store.getPlatformUsers();
      const q = searchInput.value.trim().toLowerCase();
      const statusQ = statusFilter.value;
      if (q) users = users.filter((u) => u.name.toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q));
      if (statusQ) users = users.filter((u) => u.status === statusQ);

      tbody.innerHTML = '';
      document.getElementById('emptyMsg').style.display = users.length ? 'none' : 'block';

      users.forEach((u) => {
        const tr = document.createElement('tr');
        const label = AdminUI.patientStatusLabel[u.status] || u.status;
        const pillClass = AdminUI.patientStatusPill[u.status] || 'pending';
        tr.innerHTML =
          '<td><div class="table-row-user"><div class="avatar" style="width:34px;height:34px;font-size:12px;">' + initials(u.name) + '</div><span>' + AdminUI.escapeHtml(u.name) + '</span></div></td>' +
          '<td>' + AdminUI.escapeHtml(u.university || '—') + '</td>' +
          '<td>' + u.sessionsCount + '</td>' +
          '<td><span class="pill ' + (u.anonymousMode ? 'approved' : 'rejected') + '">' + (u.anonymousMode ? 'مفعّل' : 'غير مفعّل') + '</span></td>' +
          '<td><span class="pill ' + pillClass + '">' + label + '</span></td>' +
          '<td><div class="table-actions"><a href="patient-profile.html?id=' + encodeURIComponent(u.id) + '">عرض الملف</a></div></td>';
        tbody.appendChild(tr);
      });
    }

    searchInput.addEventListener('input', render);
    statusFilter.addEventListener('change', render);
    render();
  })();
</script>
</body>
</html>
