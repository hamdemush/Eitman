<section class="section" style="min-height:calc(100vh - 82px); display:flex; align-items:center;">

    <div class="question-card">
      <h1 style="font-size:24px; margin-bottom:10px;" data-i18n="forgot.title">نسيت كلمة المرور؟</h1>
      <p style="margin-bottom:26px;" data-i18n="forgot.subtitle">أدخل بريدك الإلكتروني الجامعي وسنرسل لك رمز تحقق لإعادة تعيين كلمة المرور.</p>

      <!-- NOTE: mockup only - a real handler calls the password-reset API,
           which emails a verification code, then redirects to reset-password.html -->
      <form onsubmit="event.preventDefault(); window.location.href='reset-password.html';">
        <div class="field">
          <label for="email" data-i18n="login.emailLabel">البريد الإلكتروني الجامعي</label>
          <input type="email" id="email" name="email" placeholder="name@university.edu" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="forgot.submit">إرسال رمز التحقق</button>
      </form>

      <p class="form-foot"><a href="login.html" data-i18n="forgot.backToLogin">العودة إلى تسجيل الدخول</a></p>
    </div>
